name: CI and Create GitHub Release

on:
  push:
    branches:
      - 'production/deployment'
  workflow_dispatch:

permissions:
  contents: write  # Required to push tags and create release

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required to access all tags
          persist-credentials: true

      - name: Get user ID for verified noreply email
        id: get_user
        run: |
          USER="${{ github.actor }}"
          USER_ID=$(curl -s https://api.github.com/users/$USER | jq -r .id)
          echo "FULL_EMAIL=${USER_ID}+${USER}@users.noreply.github.com" >> $GITHUB_ENV

      - name: Set Git config
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ env.FULL_EMAIL }}"

      - name: Define version (auto-bump patch)
        id: get_version
        run: |
          LAST_TAG=$(git describe --tags `git rev-list --tags --max-count=1` 2>/dev/null || echo "")
          echo "Last tag: $LAST_TAG"

          if [[ "$LAST_TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            MAJOR=${BASH_REMATCH[1]}
            MINOR=${BASH_REMATCH[2]}
            PATCH=${BASH_REMATCH[3]}
            PATCH=$((PATCH + 1))
            VERSION="$MAJOR.$MINOR.$PATCH"
          else
            VERSION="1.0.287"
          fi

          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create and push tag if not exists
        run: |
          TAG="v${{ env.VERSION }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists – skipping push."
          else
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          fi

      - name: Get recent commit message
        id: commit_msg
        run: |
          echo "changelog=$(git log -n 1 --pretty=format:'%s (%an)')" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Release v${{ env.VERSION }}
          body: |
            🔁 **Merge Info**
            Merged from `${{ github.head_ref || github.ref_name }}` into `${{ github.base_ref || 'dev/common' }}`

            👤 **Triggered by**
            ${{ github.actor }}

            📝 **Changes in this release**
            ${{ steps.commit_msg.outputs.changelog }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ secrets.DOCKER_REGISTRY_URL }}
          username: ${{ secrets.DOCKER_REGISTRY_USERNAME }}
          password: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v3
        with:
          push: true
          file: Dockerfile.amdev_deployment
          tags: ipss.registry.techgenzi.com/amnonwovens-prod:${{ env.VERSION }}
