name: Ci and Create GitHub Release

on:
  push:
    branches:
      - 'amdev/deployment'
  workflow_dispatch:

permissions:
  contents: write  # 👈 REQUIRED to push tags      

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Get user ID for verified noreply email
        id: get_user
        run: |
          USER="${{ github.actor }}"
          USER_ID=$(curl -s https://api.github.com/users/$USER | jq -r .id)
          echo "FULL_EMAIL=${USER_ID}+${USER}@users.noreply.github.com" >> $GITHUB_ENV
      
      - name: Set Git config
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ env.FULL_EMAIL }}"
      
      - name: Define version
        id: get_version
        run: |
          VERSION=1.2.261 # You can extract this dynamically if needed

          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      
      - name: Create and push tag
        run: |
          git tag -a "v${{ env.VERSION }}" -m "Release v${{ env.VERSION }}"
          git push origin "v${{ env.VERSION }}"
              
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ secrets.DOCKER_REGISTRY_URL }}
          username: ${{ secrets.DOCKER_REGISTRY_USERNAME }}
          password: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}
          

      - name: Build and push Docker image
        uses: docker/build-push-action@v3
        with:
          push: true
          file: Dockerfile.amdev_deployment
          tags: ipss.registry.techgenzi.com/am_nonwovens:${{ env.VERSION }}

      # ✅ Release happens ONLY if build succeeds
      - name: Get recent commit messages
        id: commit_msg
        if: success()
        run: |
          echo "changelog=$(git log -n 1 --pretty=format:'%s (%an)')" >> $GITHUB_OUTPUT
      
      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Release v${{ env.VERSION }}
          body: |
            🔁 **Merge Info**
            Merged from `${{ github.head_ref || github.ref_name }}` into `${{ github.base_ref || 'dev/common' }}`
    
            👤 **Triggered by**
            ${{ github.actor }}
    
            📝 **Changes in this release**
            ${{ steps.commit_msg.outputs.changelog }}

            🐳 **Docker Image**
            `ipss.registry.techgenzi.com/am_nonwovens:${{ env.VERSION }}`
